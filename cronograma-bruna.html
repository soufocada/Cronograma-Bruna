<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cronograma Bruna</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,400&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF9FB;--card:#fff;--ink:#3A2A31;--mute:#8E7882;--line:#F4E6EB;--acc:#D9708F;--soft:#FDEFF4;--ok:#2F8F5B;--okbg:#DDF3E6;--bad:#C2415A;--badbg:#FBE2E7;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1F1519;--card:#2B1E24;--ink:#F8EDF1;--mute:#C5A9B5;--line:#443039;--acc:#EFA1BA;--soft:#3A2830;--ok:#6FD39A;--okbg:#1F3A2C;--bad:#FF8DA3;--badbg:#44222C}}
:root[data-theme="dark"]{--bg:#1F1519;--card:#2B1E24;--ink:#F8EDF1;--mute:#C5A9B5;--line:#443039;--acc:#EFA1BA;--soft:#3A2830;--ok:#6FD39A;--okbg:#1F3A2C;--bad:#FF8DA3;--badbg:#44222C}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'DM Sans',system-ui,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:24px 16px 48px}
h1{font:600 clamp(2.2rem,8vw,3.2rem)/1.05 'Fraunces',Georgia,serif;margin:0}
.by{font-size:.78rem;color:var(--mute);margin:4px 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px}
.verse{background:var(--soft);border-color:var(--soft)}
.verse p{font:italic 400 1.25rem/1.4 'Fraunces',Georgia,serif;margin:0 0 8px}
.verse small{color:var(--acc);font-weight:700}
.nav{display:flex;align-items:center;gap:8px;margin-bottom:16px}
.nav button,.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:8px 14px;font:inherit;cursor:pointer}
.nav .day{flex:1;text-align:center;font-weight:700}
.nav .day span{display:block;font-weight:400;font-size:.8rem;color:var(--mute)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.check{display:flex;align-items:center;gap:12px;font-weight:700;cursor:pointer}
.check input{width:28px;height:28px;accent-color:var(--ok)}
h2{font:600 1.15rem 'Fraunces',Georgia,serif;margin:0 0 12px}
.entry{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:8px 0}
label{font-size:.8rem;color:var(--mute);display:block}
input[type=text],input[type=number],textarea{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:8px 10px;font:inherit}
textarea{resize:vertical;min-height:52px}
.pct{display:flex;flex-direction:column;justify-content:flex-end}
.pill{display:inline-block;border-radius:99px;padding:8px 10px;text-align:center;font-weight:700;background:var(--soft)}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.bad{background:var(--badbg);color:var(--bad)}
.top{display:flex;gap:8px}.top input{flex:1}
.del{color:var(--bad)!important;padding:8px 12px!important}
.sum{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.sum div{flex:1;min-width:90px;background:var(--soft);border-radius:12px;padding:10px;text-align:center}
.sum b{display:block;font-size:1.4rem}
.ref{border-left:4px solid var(--bad);background:var(--badbg);padding:8px 12px;border-radius:0 10px 10px 0;margin-bottom:8px}
.ref small{color:var(--mute);display:block}
.empty{color:var(--mute);font-size:.9rem}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{text-align:center;font-size:.75rem;color:var(--mute)}
.cell{aspect-ratio:1;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-size:.85rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;line-height:1.1}
.cell.done{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:700}
.cell.today{box-shadow:0 0 0 2px var(--acc)}
.cell.sel{outline:3px solid var(--acc);outline-offset:1px}
.cell.blank{visibility:hidden}
.cell i{font-style:normal;font-size:.7rem}
</style>
</head>
<body>
<div class="wrap">
  <h1>Cronograma Bruna</h1>
  <div class="by">feito por @sou.focada</div>

  <div class="nav">
    <button id="prev" aria-label="Dia anterior">‹</button>
    <div class="day" id="dayLabel"></div>
    <button id="next" aria-label="Próximo dia">›</button>
    <button id="hoje">Hoje</button>
  </div>

  <div class="card verse"><p id="vText"></p><small id="vRef"></small></div>

  <div class="card">
    <label class="check"><input type="checkbox" id="done"> <span id="doneTxt">Cumpri meu estudo de hoje</span></label>
  </div>

  <div class="card">
    <h2>O que estudei</h2>
    <div id="entries"></div>
    <button class="btn" id="add">+ Adicionar assunto</button>
    <div class="sum" id="sum"></div>
  </div>

  <div class="card">
    <h2>Preciso reforçar</h2>
    <div id="refDay"></div>
    <h2 style="margin-top:16px">Reforço geral (assuntos abaixo de 70%)</h2>
    <div id="refAll"></div>
  </div>

  <div class="card">
    <div class="cal-h">
      <button class="btn" id="mPrev" aria-label="Mês anterior">‹</button>
      <h2 id="mLabel" style="margin:0"></h2>
      <button class="btn" id="mNext" aria-label="Próximo mês">›</button>
    </div>
    <div class="grid" id="wds"></div>
    <div class="grid" id="grid" style="margin-top:6px"></div>
    <p class="empty" id="streak" style="margin:12px 0 0"></p>
  </div>
</div>

<script>
const VERSES=[
["Entrega as tuas obras ao Senhor, e os teus pensamentos serão estabelecidos.", "Provérbios 16:3"],
["Tudo posso naquele que me fortalece.", "Filipenses 4:13"],
["Porque eu bem sei os pensamentos que tenho a vosso respeito, diz o Senhor; pensamentos de paz, e não de mal, para vos dar o fim que esperais.", "Jeremias 29:11"],
["Entrega o teu caminho ao Senhor; confia nele, e o mais ele fará.", "Salmos 37:5"],
["Sede fortes e corajosos; não temais. O Senhor teu Deus é quem vai contigo; não te deixará, nem te desamparará.", "Deuteronômio 31:6"],
["Não te mandei eu? Sê forte e corajosa; não temas, porque o Senhor teu Deus é contigo por onde quer que andares.", "Josué 1:9"],
["Não temas, porque eu sou contigo; eu te fortaleço, e te ajudo.", "Isaías 41:10"],
["Instruir-te-ei e ensinar-te-ei o caminho que deves seguir; guiar-te-ei com os meus olhos.", "Salmos 32:8"],
["Se alguém tem falta de sabedoria, peça-a a Deus, que a todos dá liberalmente.", "Tiago 1:5"],
["Porque o Senhor dá a sabedoria; da sua boca vem o conhecimento e o entendimento.", "Provérbios 2:6"],
["Os pensamentos do diligente tendem só à abundância.", "Provérbios 21:5"],
["Não nos cansemos de fazer o bem, porque a seu tempo ceifaremos, se não desfalecermos.", "Gálatas 6:9"],
["Tudo quanto fizerem, façam-no de todo o coração, como ao Senhor.", "Colossenses 3:23"],
["Aquele que começou a boa obra em vós há de completá-la.", "Filipenses 1:6"],
["Os que esperam no Senhor renovarão as suas forças e subirão com asas como águias.", "Isaías 40:31"],
["Tudo quanto fizer prosperará.", "Salmos 1:3"],
["Viste um homem diligente na sua obra? Perante reis será posto.", "Provérbios 22:29"],
["Se Deus é por nós, quem será contra nós?", "Romanos 8:31"],
["Seja sobre nós a graça do Senhor, e confirma sobre nós a obra das nossas mãos.", "Salmos 90:17"],
["Pedi, e dar-se-vos-á; buscai, e encontrareis; batei, e abrir-se-vos-á.", "Mateus 7:7"],
["Tudo o que pedirdes em oração, crede que o recebereis, e tê-lo-eis.", "Marcos 11:24"],
["Deus não nos deu o espírito de covardia, mas de poder, de amor e de moderação.", "2 Timóteo 1:7"],
["Conceda-te o Senhor conforme o teu coração, e cumpra todos os teus desígnios.", "Salmos 20:4"],
["Reconhece o Senhor em todos os teus caminhos, e ele endireitará as tuas veredas.", "Provérbios 3:6"],
["Tu, Senhor, abençoarás o justo; circundá-lo-ás de benevolência como com um escudo.", "Salmos 5:12"],
["Tudo quanto te vier à mão para fazer, faze-o conforme as tuas forças.", "Eclesiastes 9:10"],
["O Senhor te porá por cabeça, e não por cauda.", "Deuteronômio 28:13"],
["O Senhor aperfeiçoará o que me concerne.", "Salmos 138:8"],
["O vosso trabalho não é vão no Senhor.", "1 Coríntios 15:58"],
["Alegres na esperança, fortes na tribulação, perseverantes na oração.", "Romanos 12:12"],
["Os que semeiam em lágrimas segarão com alegria.", "Salmos 126:5"]
];
const WD=["D","S","T","Q","Q","S","S"];
const MESES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const DIAS=["domingo","segunda-feira","terça-feira","quarta-feira","quinta-feira","sexta-feira","sábado"];
let data={};
try{data=JSON.parse(localStorage.getItem("cronBruna")||"{}")}catch(e){data={}}
const save=()=>{try{localStorage.setItem("cronBruna",JSON.stringify(data))}catch(e){}};
const key=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const $=id=>document.getElementById(id);
let cur=new Date();cur.setHours(12,0,0,0);
let view=new Date(cur.getFullYear(),cur.getMonth(),1,12);
const todayK=key(cur);
const get=k=>data[k]||(data[k]={done:false,entries:[]});
const pct=(a,q)=>q>0?Math.round(a/q*100):null;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function render(){
  const k=key(cur),d=get(k);
  $("dayLabel").innerHTML=cur.getDate()+" de "+MESES[cur.getMonth()]+"<span>"+DIAS[cur.getDay()]+(k===todayK?" · hoje":"")+"</span>";
  const doy=Math.floor((cur-new Date(cur.getFullYear(),0,0))/864e5);
  const v=VERSES[doy%VERSES.length];
  $("vText").textContent="“"+v[0]+"”";$("vRef").textContent=v[1]+"";
  $("done").checked=d.done;
  $("doneTxt").textContent=d.done?"Dia cumprido!":"Cumpri meu estudo deste dia";
  const box=$("entries");box.innerHTML="";
  if(!d.entries.length)box.innerHTML='<p class="empty">Nenhum assunto ainda. Adicione o que você estudou.</p>';
  d.entries.forEach((e,i)=>{
    const p=pct(e.a,e.q),cls=p===null?"":(p>=70?"ok":"bad");
    const el=document.createElement("div");el.className="entry";
    el.innerHTML=`<div class="top"><input type="text" placeholder="Assunto estudado" value="${esc(e.s)}" data-f="s" aria-label="Assunto"><button class="btn del" aria-label="Remover assunto">✕</button></div>
    <div class="row"><div><label>Questões feitas</label><input type="number" min="0" value="${e.q}" data-f="q"></div>
    <div><label>Acertos</label><input type="number" min="0" value="${e.a}" data-f="a"></div>
    <div class="pct"><label>Aproveitamento</label><span class="pill ${cls}">${p===null?"—":p+"%"}</span></div></div>
    <label>O que preciso melhorar nesse assunto</label><textarea data-f="r" placeholder="Ex.: rever regras de acentuação">${esc(e.r)}</textarea>`;
    el.querySelectorAll("[data-f]").forEach(inp=>{
      inp.addEventListener("input",()=>{
        const f=inp.dataset.f;
        e[f]=(f==="q"||f==="a")?Math.max(0,parseInt(inp.value)||0):inp.value;
        if(e.a>e.q&&(f==="q"||f==="a")){e.a=e.q}
        save();
        if(f==="q"||f==="a"){render();} else {summary();}
      });
    });
    el.querySelector(".del").onclick=()=>{d.entries.splice(i,1);save();render()};
    box.appendChild(el);
  });
  summary();cal();
}
function summary(){
  const d=get(key(cur));
  const q=d.entries.reduce((s,e)=>s+e.q,0),a=d.entries.reduce((s,e)=>s+e.a,0),p=pct(a,q);
  $("sum").innerHTML=`<div><b>${q}</b>questões</div><div><b>${a}</b>acertos</div><div><b>${p===null?"—":p+"%"}</b>do dia</div>`;
  const low=d.entries.filter(e=>(e.s||e.r)&&(e.q>0&&pct(e.a,e.q)<70||e.r.trim()));
  $("refDay").innerHTML=low.length?low.map(e=>{const p=pct(e.a,e.q);return `<div class="ref"><b>${esc(e.s||"Sem nome")}</b>${p!==null?" — "+p+"%":""}<small>${esc(e.r||"Revisar este assunto e refazer questões.")}</small></div>`}).join(""):'<p class="empty">Nada para reforçar neste dia. Continue assim!</p>';
  const by={};
  Object.values(data).forEach(day=>day.entries.forEach(e=>{const n=(e.s||"").trim();if(!n||!e.q)return;const o=by[n.toLowerCase()]||(by[n.toLowerCase()]={n,q:0,a:0});o.q+=e.q;o.a+=e.a}));
  const list=Object.values(by).map(o=>({...o,p:pct(o.a,o.q)})).filter(o=>o.p<70).sort((x,y)=>x.p-y.p);
  $("refAll").innerHTML=list.length?list.map(o=>`<div class="ref"><b>${esc(o.n)}</b> — ${o.p}%<small>${o.a} acertos em ${o.q} questões</small></div>`).join(""):'<p class="empty">Nenhum assunto abaixo de 70% por enquanto.</p>';
}
function cal(){
  $("mLabel").textContent=MESES[view.getMonth()]+" "+view.getFullYear();
  const g=$("grid");g.innerHTML="";
  const first=new Date(view.getFullYear(),view.getMonth(),1).getDay();
  const n=new Date(view.getFullYear(),view.getMonth()+1,0).getDate();
  for(let i=0;i<first;i++){const b=document.createElement("div");g.appendChild(b)}
  let count=0;
  for(let i=1;i<=n;i++){
    const dt=new Date(view.getFullYear(),view.getMonth(),i,12),k=key(dt),dd=data[k];
    const b=document.createElement("button");
    b.className="cell"+(dd&&dd.done?" done":"")+(k===todayK?" today":"")+(k===key(cur)?" sel":"");
    if(dd&&dd.done)count++;
    b.innerHTML=(dd&&dd.done?"<i>✓</i>":"")+i;
    b.setAttribute("aria-label","Dia "+i+(dd&&dd.done?", cumprido":""));
    b.onclick=()=>{cur=dt;render()};
    g.appendChild(b);
  }
  const total=Object.values(data).filter(x=>x.done).length;
  $("streak").textContent=count+" dia(s) cumprido(s) neste mês · "+total+" no total";
}
$("wds").innerHTML=WD.map(w=>`<div class="wd">${w}</div>`).join("");
$("done").onchange=e=>{get(key(cur)).done=e.target.checked;save();render()};
$("add").onclick=()=>{get(key(cur)).entries.push({s:"",q:0,a:0,r:""});save();render()};
const go=n=>{cur=new Date(cur.getFullYear(),cur.getMonth(),cur.getDate()+n,12);view=new Date(cur.getFullYear(),cur.getMonth(),1,12);render()};
$("prev").onclick=()=>go(-1);$("next").onclick=()=>go(1);
$("hoje").onclick=()=>{cur=new Date();cur.setHours(12,0,0,0);view=new Date(cur.getFullYear(),cur.getMonth(),1,12);render()};
$("mPrev").onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1,12);cal()};
$("mNext").onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1,12);cal()};
render();
</script>
</body>
</html>
